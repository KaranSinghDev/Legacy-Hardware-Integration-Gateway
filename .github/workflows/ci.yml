name: LHIG Quality & Integration CI

on:
  push:
    branches: [ "Release", "master", "Build" ] # Added main/master/dev
  pull_request:
    branches: [ "Build", "master", "Release" ]

jobs:
  # --- STAGE 1: Static Analysis ---
  code-quality:
    name: C++ Static Analysis (CppCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install CppCheck
        run: sudo apt-get install -y cppcheck

      - name: Run CppCheck
        run: >
          cppcheck
          --enable=warning,style,performance,portability
          --error-exitcode=1
          --suppress=missingInclude
          -I ./include
          ./src

  # --- STAGE 2: Memory & Logic Verification ---
  # Builds the gateway outside of Docker to run ASan quickly.
  # If we had GTest unit tests, they would run here.
  memory-verification:
    name: C++ Memory Safety Check (ASan)
    runs-on: ubuntu-latest
    needs: code-quality # Only runs if Stage 1 passes
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Need open62541 source for this build

      - name: Install Build Dependencies
        run: sudo apt-get install -y build-essential cmake

      - name: Build with AddressSanitizer
        run: |
          mkdir build && cd build
          # Build with strict flags and ASan enabled
          cmake -DENABLE_ASAN=ON ..
          cmake --build .
          # Note: Since there's no unit test executable, this step just proves
          # that the code compiles cleanly with memory sanitizers injected.
          echo "ASan build successful."

  # --- STAGE 3: Full System Benchmark ---
  integration-benchmark:
    name: System Integration Benchmark
    runs-on: ubuntu-latest
    needs: memory-verification # Only runs if Stage 2 passes
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Benchmark Dependencies
        run: pip install -r benchmark/requirements.txt

      - name: Start System with Docker Compose
        run: docker compose up --build --detach

      - name: Wait for System Initialization
        run: sleep 15 # Increased wait time for CI runner stability

      - name: Verify Containers are Running
        run: docker compose ps

      - name: Run OPC UA Benchmark Suite
        run: pytest -v -s benchmark/test_gateway.py

      - name: Print Logs on Failure
        if: failure()
        run: docker compose logs gateway

      - name: Teardown
        if: always()
        run: docker compose down -v



      










    







































  