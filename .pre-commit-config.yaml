repos:
  # 1. Standard Sanity Checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  # 2. C++ Formatting
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v17.0.6
    hooks:
      - id: clang-format
        files: \.(cpp|hpp|c|h)$
        args: ['-style=LLVM', '-i']

  # 3. Python AUTO-FORMATTER (The Janitor)
  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        files: \.py$

  # 4. Python LINTER (The Inspector)
  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        files: \.py$
        # Tell flake8 to agree with Black's line length and ignore whitespace rules
        args: ['--max-line-length=88', '--extend-ignore=E201,E202,E203']
