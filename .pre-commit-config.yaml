repos:
  # 1. Standard Sanity Checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # 2. C++ Formatting (CERN Standard)
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v17.0.6
    hooks:
      - id: clang-format
        # Use 'types' instead of 'types_or' for stricter matching
        types: [c++] 
        args: ['-style=LLVM', '-i']

  # 3. Python Linting (for the simulator & benchmark scripts)
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8